services:
  etl-collect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enervision-etl-collect
    environment:
      - API_BASE=http://10.105.200.45:8000
      - DOSSIER_BRONZE=bronze
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bronze:/app/bronze
      - ./silver:/app/silver
      - ./gold:/app/gold
      - ./quarantine:/app/quarantine
      - ./manifests:/app/manifests
      - INTERVALLE_SECONDES=60
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET_BRONZE=bronze
      - MINIO_BUCKET_AUDIT=audit
      - MINIO_USE_SSL=false
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - enervision-network
    healthcheck:
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  enervision-network:
    external: true
    name: infra_enervision-network