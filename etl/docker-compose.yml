services:
  etl-collect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enervision-etl-collect
    # Aucun volume : bronze, silver, gold, quarantine et l'état incrémental
    # vivent tous dans MinIO. Rien n'est écrit sur le disque hôte.
    environment:
      - API_BASE=http://10.105.200.45:8000
      - PYTHONUNBUFFERED=1
      - INTERVALLE_SECONDES=60
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET_BRONZE=bronze
      - MINIO_BUCKET_SILVER=silver
      - MINIO_BUCKET_GOLD=gold
      - MINIO_BUCKET_QUARANTINE=quarantine
      - MINIO_BUCKET_MANIFESTS=manifests
      - MINIO_BUCKET_AUDIT=audit
      - MINIO_USE_SSL=false
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - enervision-network
    healthcheck:
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  enervision-network:
    external: true
    name: infra_enervision-network