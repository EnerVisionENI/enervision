  - id: GHSA-gqvg-gmmx-x4hm
    statement: >-
      ATTENTION, celle-ci est cote client et nous concerne directement : le controle MLFLOW_ALLOW_PICKLE_DESERIALIZATION=False est contournable via le flavor statsmodels, soit exactement le chemin qu'emprunte predict.py pour charger les modeles TOWT. Un modele pickle piege depose dans le bucket mlflow-artifacts donne une execution de code dans le conteneur d'inference. Risque accepte parce que deposer un objet dans ce bucket suppose deja les credentials root MinIO, qui ouvrent bien plus large ; mais c'est une escalade reelle, et c'est la raison la plus forte de passer a mlflow-skinny ou 3.x.
    expired_at: 2026-12-01
  - id: CVE-2026-25087
    statement: >-
      Deni de service (use-after-free) dans Apache Arrow C++. Correctif en pyarrow 23.0.1, inatteignable tant que mlflow 2.x impose pyarrow<20. pyarrow n'est utilise ici que pour lire des Parquet du gold, jamais sur une entree fournie par un tiers.
    expired_at: 2026-12-01
