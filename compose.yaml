# Stack EnerVision complète — un seul fichier, une seule commande.
#
#   docker compose up -d --build                 # cœur : postgres, minio, api, front
#   docker compose --profile etl up -d --build   # + pipeline ETL
#   docker compose --profile observability up -d # + Prometheus / Grafana / exporters
#   docker compose --profile mlflow up -d --build   # + tracking MLflow (voir infra/mlflow/DEPLOYMENT.md)
#   docker compose --profile etl --profile audit --profile proxy --profile observability --profile mlflow up -d --build   # tout
#
# Toutes les variables sensibles viennent de .env à la racine (voir .env.example).

name: enervision

services:
  # --------------------------------------------------------------------------
  # Infrastructure (toujours démarrée)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ev006-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -d explicite : sans lui, pg_isready vise une base nommée comme l'utilisateur
      # (ev_admin), qui n'existe pas — le check passait mais logguait un FATAL toutes les 10 s.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enervision-network

  minio:
    image: minio/minio:latest
    container_name: enervision-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - enervision-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: enervision-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./infra/minio/init-buckets.sh:/init-buckets.sh:ro
    networks:
      - enervision-network
    restart: "no"

  # --------------------------------------------------------------------------
  # Application (toujours démarrée)
  # --------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: enervision-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      # Réseau interne Compose : écrase localhost:5433 hérité de .env.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enervision-network
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: enervision-front
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      NODE_ENV: production
    networks:
      - enervision-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Pipeline ETL — profile "etl"
  # --------------------------------------------------------------------------
  # Collecte 100 % temps réel : etl-collect interroge l'API toutes les
  # INTERVALLE_SECONDES et promeut bronze -> silver au fil de l'eau. Pas de
  # rattrapage d'historique — la donnée ne commence qu'au premier cycle de collecte.
  etl-collect:
    build:
      context: ./etl
      dockerfile: Dockerfile
    image: enervision-etl:local
    container_name: enervision-etl-collect
    profiles: ["etl"]
    # Aucun volume : bronze, silver, gold, quarantine et l'état incrémental
    # vivent tous dans MinIO. Rien n'est écrit sur le disque hôte.
    env_file:
      - .env
    environment:
      API_BASE: ${API_BASE:-http://10.105.200.45:8000}
      INTERVALLE_SECONDES: ${INTERVALLE_SECONDES:-60}
      # Le gold n'est pas recalculé à chaque cycle de collecte (il relit tout le silver
      # de la partition et faisait déborder le cycle) mais sur ces deux plannings.
      GOLD_CRON_HORAIRE: ${GOLD_CRON_HORAIRE:-3 * * * *}
      GOLD_CRON_QUOTIDIEN: ${GOLD_CRON_QUOTIDIEN:-15 0 * * *}
      PYTHONUNBUFFERED: "1"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
      MINIO_BUCKET_QUARANTINE: quarantine
      MINIO_BUCKET_MANIFESTS: manifests
      MINIO_BUCKET_AUDIT: audit
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    # minio-init crée les buckets ; collect.py y écrit sans les créer lui-même.
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enervision-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Collecte des alertes (API Mock IoT -> table alerts Postgres) — profile "etl"
  etl-alerts:
    build:
      context: ./etl
      dockerfile: Dockerfile
    image: enervision-etl:local
    container_name: enervision-etl-alerts
    profiles: ["etl"]
    command: ["python", "alerts.py"]
    env_file:
      - .env
    environment:
      API_BASE: ${API_BASE:-http://10.105.200.45:8000}
      ALERTS_INTERVALLE_SECONDES: ${ALERTS_INTERVALLE_SECONDES:-300}
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enervision-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Synchro des sites (API Mock IoT -> table sites Postgres) — profile "etl"
  # NOTE: sites.py est encore un stub (ne fait rien). restart:"no" tant qu'il
  # n'est pas implémenté, sinon le conteneur boucle. Passer à unless-stopped ensuite.
  etl-sites:
    build:
      context: ./etl
      dockerfile: Dockerfile
    image: enervision-etl:local
    container_name: enervision-etl-sites
    profiles: ["etl"]
    command: ["python", "sites.py"]
    env_file:
      - .env
    environment:
      API_BASE: ${API_BASE:-http://10.105.200.45:8000}
      SITES_INTERVALLE_SECONDES: ${SITES_INTERVALLE_SECONDES:-60}
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - enervision-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Synchro audit -> Azure Blob — profile "audit"
  # --------------------------------------------------------------------------
  audit-sync:
    image: rclone/rclone:latest
    container_name: enervision-audit-sync
    profiles: ["audit"]
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/sync-audit-to-azure.sh"]
    volumes:
      - ./infra/audit-sync/sync-audit-to-azure.sh:/sync-audit-to-azure.sh:ro
    networks:
      - enervision-network

  # --------------------------------------------------------------------------
  # MLflow (tracking + registry des modèles ML) — profile "mlflow"
  #
  # Réutilise le postgres existant (base "mlflow" séparée, à créer une fois
  # à la main sur le serveur — voir infra/mlflow/DEPLOYMENT.md, les scripts
  # d'init postgres ne rejouent pas sur un volume déjà initialisé) et le
  # minio existant (bucket "mlflow-artifacts", créé par infra/minio/init-buckets.sh).
  # --------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: enervision-mlflow
    profiles: ["mlflow"]
    # L'image officielle n'embarque pas psycopg2 (driver postgres) : installé au
    # démarrage, faute d'image mieux adaptée disponible sur le registre public.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        pip install --no-cache-dir psycopg2-binary &&
        mlflow server
        --backend-store-uri=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --default-artifact-root=s3://mlflow-artifacts
        --host=0.0.0.0
        --port=5000
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - enervision-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Reverse proxy Traefik — profile "proxy"
  # --------------------------------------------------------------------------
  traefik:
    image: traefik:v2.10
    container_name: enervision-traefik
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/traefik/traefik.yml:/traefik.yml:ro
      - ./infra/traefik/acme.json:/acme.json
    networks:
      - enervision-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Observabilité — profile "observability"
  # --------------------------------------------------------------------------
  # Métriques serveur : node-exporter (hôte : CPU / RAM / disque / réseau de la
  # VM) et cAdvisor (par conteneur) sont scrapés par Prometheus ; Grafana les
  # affiche via un dashboard et une datasource provisionnés automatiquement
  # depuis ./infra/grafana. Aucun de ces services n'est nécessaire au
  # fonctionnement de l'application.
  #
  #   docker compose --profile observability up -d
  #   Grafana     http://localhost:3001   (admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
  #   Prometheus  http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: enervision-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - enervision-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: enervision-node-exporter
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|rootfs|run/credentials/.+|var/lib/docker/.+)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|overlay|tmpfs|squashfs|nsfs|shm)$$"
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - enervision-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: enervision-cadvisor
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      # 8080 côté hôte est pris par le dashboard Traefik (profile proxy).
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - enervision-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: enervision-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # 3000 côté hôte est pris par le front.
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - enervision-network

networks:
  enervision-network:
    driver: bridge

volumes:
  # Noms épinglés sur ceux créés par l'ancien projet Compose "infra", pour que
  # les données Postgres / MinIO déjà en place sur le serveur soient réutilisées.
  pgdata:
    name: infra_pgdata
  miniodata:
    name: infra_miniodata
  # Données de l'observabilité (profile "observability").
  promdata:
  grafanadata:
