name: Trivy Docker Image Scan

on:
  workflow_run:
    workflows: ["EV-003 - ETL build et test"]
    types: [completed]
  schedule:
    # Rescan main daily to catch new CVEs published against unchanged images.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: front
            dockerfile: front/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: enervision-${{ matrix.name }}:scan

      - name: Trivy scan (full report, JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enervision-${{ matrix.name }}:scan
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.json
          retention-days: 30

      - name: Trivy scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enervision-${{ matrix.name }}:scan
          format: table
          output: trivy-${{ matrix.name }}.table.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish results to job summary
        if: always()
        run: |
          echo "### Trivy scan: ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-${{ matrix.name }}.table.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
