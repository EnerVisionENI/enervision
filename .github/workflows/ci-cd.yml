# Pipeline unique : remplace deploy-dev.yml + trivy.yml + etl-ci.yml.
#
#   test-api ┐
#   test-etl ├─→ build (build → Trivy → push GHCR) ─→ test-e2e ─→ deploy
#   build-front ┘
#
# Les images sont construites UNE SEULE FOIS, dans le job `build`, taguées par
# SHA de commit et poussées sur ghcr.io. test-e2e et deploy les `pull` — ils ne
# reconstruisent plus rien. C'est ce qui rend le scan Trivy et les tests e2e
# valables : l'artefact scanné, l'artefact testé et l'artefact déployé sont le
# même digest, pas trois builds successifs d'un même Dockerfile (une base image
# ou une dépendance transitive peut bouger entre deux builds).
#
# Ordre build → scan → push (et pas push → scan) : une image qui échoue au scan
# CRITICAL/HIGH n'atteint jamais la registry.
#
# test-e2e tourne contre une copie jetable de la stack (ports/volumes/noms de
# conteneurs distincts, cf. compose.ci.yml), jamais contre la vraie prod. Si les
# tests e2e échouent, deploy ne se lance pas (needs: [test-e2e]) : la prod reste
# sur l'ancienne version qui marchait.

name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    # Rescan quotidien de main pour détecter les nouvelles CVE sur des images
    # inchangées (ex-trivy.yml). Seul le job trivy tourne dans ce cas, cf. les
    # `if:` ci-dessous.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: enervision-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Tag immuable : un tag mouvant (`dev`, `latest`) ne permettrait pas de
  # garantir que deploy récupère l'image que Trivy a scannée dans CE run.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test-api:
    name: API lint + tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      # Version fixée : une nouvelle release de ruff peut activer de nouvelles
      # règles par défaut et faire échouer la CI sans qu'aucun code n'ait changé.
      - name: Install ruff
        run: pip install ruff==0.16.6

      # Config partagée dans pyproject.toml (racine) : mêmes règles que etl/.
      - name: Lint (ruff)
        run: ruff check api

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt

      - name: Run API tests
        run: pytest api/tests -q

  test-etl:
    name: ETL lint + tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./etl
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements-dev.txt

      # Même version que test-api : mêmes règles pyproject.toml, même risque de dérive.
      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Lint (ruff)
        run: ruff check .

      - name: Install ETL dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ETL tests
        run: pytest tests/ -v

  test-backup:
    name: Backup script tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./infra/backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/backup/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Pas de pg_dump/rclone ici : ces commandes sont mockées dans les tests. gzip,
      # lui, est utilisé pour de vrai (déjà présent sur ubuntu-latest).
      - name: Run backup script tests
        run: pytest tests/ -v

  build-front:
    name: Frontend lint + tests + build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 est EOL (avril 2026) et ne satisfait plus les engines de
          # certaines deps transitives (js-beautify -> nopt -> abbrev, qui
          # exigent >=22.22 / >=24.15 / >=26) : alignée sur front/Dockerfile.
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Lint frontend
        working-directory: front
        run: npm run lint

      - name: Run frontend tests
        working-directory: front
        run: npm run test

      - name: Build frontend
        working-directory: front
        run: npm run build

  build:
    name: Build + scan + push (${{ matrix.name }})
    # Tourne toujours, y compris sur le cron nocturne (rescan de main) : c'est le
    # seul job que le déclenchement `schedule` doit exécuter.
    #
    # Le job est idempotent : si le tag sha-<commit> existe déjà sur GHCR, il est
    # tiré au lieu d'être reconstruit. Un « Re-run all jobs » ne recompile donc
    # rien, et le cron nocturne rescanne l'image RÉELLEMENT publiée plutôt qu'un
    # rebuild qui serait, par construction, un artefact différent.
    needs: [test-api, test-etl, test-backup, build-front]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Nécessaire pour pousser sur ghcr.io avec le GITHUB_TOKEN du run : pas de
      # PAT à gérer ni à faire tourner. Accordé ici seulement, pas au niveau du
      # workflow — les jobs de test n'ont aucune raison d'écrire dans la registry.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
            context: ./api
          - name: front
            dockerfile: front/Dockerfile
            # ./front ne suffit pas : front/Dockerfile copie aussi infra/nginx.conf,
            # hors de front/ — donc contexte racine, seule exception des 4.
            context: .
          - name: etl
            dockerfile: etl/Dockerfile
            context: ./etl
          - name: ml
            dockerfile: ml/Dockerfile
            context: ./ml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io refuse un namespace contenant des majuscules, et
      # github.repository_owner vaut "EnerVisionENI". Actions n'a pas de
      # fonction toLower() dans les expressions : on le calcule en shell.
      - name: Compute image reference
        run: |
          set -e
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${REGISTRY}/${owner}/enervision-${{ matrix.name }}" >> "$GITHUB_ENV"

      # Login en amont du build : nécessaire pour interroger la registry au step
      # suivant, pas seulement pour pousser à la fin.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le tag est dérivé du SHA de commit : s'il est déjà sur GHCR, l'image
      # correspondante a forcément passé le scan (l'ordre build -> scan -> push
      # garantit que rien n'entre dans la registry sans être validé). Inutile de
      # la reconstruire — on la tire, ce qui rend le job idempotent.
      - name: Check whether the image is already published
        id: published
        run: |
          set -e
          if docker manifest inspect "${IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE}:${IMAGE_TAG} déjà publiée — build ignoré."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE}:${IMAGE_TAG} absente — build nécessaire."
          fi

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # push: false / load: true — l'image reste sur le runner le temps du scan.
      # Le push a lieu plus bas, seulement si Trivy passe.
      #
      # Cache de couches stocké sur GHCR à côté des images (type=registry) plutôt
      # que dans le cache GHA : pas de plafond de 10 Go partagé avec le reste du
      # dépôt, pas d'éviction au bout de 7 jours d'inactivité, et l'export est
      # plus rapide que le mode=max de type=gha.
      - name: Build ${{ matrix.name }} image
        if: steps.published.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Trivy scanne une image locale : il faut la tirer quand on a sauté le build.
      - name: Pull already published image
        if: steps.published.outputs.found == 'true'
        run: docker pull "${IMAGE}:${IMAGE_TAG}"

      - name: Trivy scan (full report, JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.json
          retention-days: 30

      - name: Trivy scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          output: trivy-${{ matrix.name }}.table.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish results to job summary
        if: always()
        run: |
          echo "### Trivy scan: ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-${{ matrix.name }}.table.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # À partir d'ici, le scan est passé : l'image peut entrer dans la registry.
      # Rien à pousser si elle y était déjà, ni sur `schedule` (le cron ne fait
      # que rescanner du déjà-publié, il ne produit aucun artefact nouveau).
      #
      # Sur pull_request le push a bien lieu : test-e2e doit pouvoir pull l'image
      # exacte qui vient d'être scannée. Le GITHUB_TOKEN d'une PR issue d'un fork
      # est en lecture seule et ce step échouerait — le dépôt est privé et sans
      # forks (même hypothèse que celle déjà assumée pour le runner self-hosted
      # sur pull_request, cf. commentaire dans test-e2e).
      - name: Push ${{ matrix.name }} image
        if: github.event_name != 'schedule' && steps.published.outputs.found != 'true'
        run: |
          set -e
          docker push "${IMAGE}:${IMAGE_TAG}"

      # Tag mouvant en plus du tag SHA, uniquement sur push de branche : confort
      # pour identifier à l'oeil ce que porte dev/main dans l'UI des packages. Le
      # pipeline, lui, ne s'appuie que sur le tag SHA. Réappliqué même quand le
      # build a été sauté : un « Re-run » sur un ancien commit doit pouvoir
      # repositionner le tag de branche.
      - name: Update moving branch tag
        if: github.event_name == 'push'
        run: |
          set -e
          docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:${{ github.ref_name }}"
          docker push "${IMAGE}:${{ github.ref_name }}"

  test-e2e:
    name: E2E (stack éphémère)
    needs: [build]
    # Tourne aussi sur les PR (pas seulement sur push vers dev) : un e2e cassé ne
    # doit pas pouvoir être mergé sans avoir été vu. Concurrency dédiée ci-dessous
    # car compose.ci.yml utilise des noms de conteneurs/ports fixes (un seul
    # runner self-hosted) : deux stacks e2e ne peuvent pas tourner en parallèle.
    #
    # Risque accepté : runner self-hosted déclenché sur pull_request avec accès aux
    # secrets. Acceptable uniquement parce que le dépôt est privé et que seuls des
    # contributeurs de confiance peuvent ouvrir des PR — sur un dépôt public ou avec
    # des forks externes, ce même déclencheur permettrait d'exécuter du code
    # arbitraire sur cette machine (voir la doc GitHub sur les self-hosted runners).
    # workflow_dispatch restreint à dev : ce if est réécrit à partir du fichier
    # présent sur la branche sélectionnée au lancement, donc ce n'est pas une
    # vraie barrière de sécurité contre un acteur qui la modifierait sur sa
    # propre branche — seulement un garde-fou contre un lancement manuel par
    # erreur depuis une mauvaise branche par un contributeur de confiance.
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/dev' && github.event_name != 'schedule')
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      # Lecture seule : ce job consomme les images, il n'en publie aucune.
      packages: read
    concurrency:
      group: enervision-ci-e2e
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Restore production env file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          RCLONE_CRYPT_PASSWORD_RAW: ${{ secrets.RCLONE_CRYPT_PASSWORD_RAW }}
        run: |
          set -e
          # Valeurs non sensibles (versionnées) + mots de passe/clés (secrets
          # GitHub Actions) concaténés en un seul .env racine.
          #
          # Dupliqué à l'identique dans le job deploy (volontairement, pas une
          # dette technique) : garder ce step inline plutôt que dans une action
          # composite partagée limite le rayon d'impact si ce job e2e (déclenché
          # sur pull_request) était un jour compromis — une action partagée
          # modifiée affecterait test-e2e ET deploy en même temps.
          cp infra/env/production.env .env
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
            echo "INGEST_API_KEY=$INGEST_API_KEY"
            echo "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD"
            echo "AZURE_STORAGE_KEY=$AZURE_STORAGE_KEY"
            echo "RCLONE_CRYPT_PASSWORD_RAW=$RCLONE_CRYPT_PASSWORD_RAW"
          } >> .env

      - name: Compute image references
        run: |
          set -e
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ns="${REGISTRY}/${owner}"
          echo "API_IMAGE=${ns}/enervision-api:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "ETL_IMAGE=${ns}/enervision-etl:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `pull` explicite puis `up --no-build` : les tests e2e tournent sur les
      # images exactes que Trivy vient de valider, plus sur un rebuild local.
      # API_IMAGE / ETL_IMAGE sont interpolées par compose dans compose.yaml
      # (elles ont un défaut local pour le dev hors CI). front n'est pas démarré
      # ici, donc FRONT_IMAGE n'est pas nécessaire (cf. compose.ci.yml).
      - name: Start ephemeral stack (compose.ci.yml)
        run: |
          set -e
          docker compose -f compose.yaml -f compose.ci.yml -p enervision-ci --profile etl \
            pull postgres minio minio-init api etl-collect etl-alerts etl-sites
          docker compose -f compose.yaml -f compose.ci.yml -p enervision-ci --profile etl \
            up -d --no-build postgres minio minio-init api etl-collect etl-alerts etl-sites

      - name: Wait for API health
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18000/health >/dev/null; then
              echo "API prête."
              exit 0
            fi
            sleep 2
          done
          echo "L'API ne répond toujours pas sur /health après 60s."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install e2e dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e/requirements.txt

      - name: Run e2e tests
        env:
          E2E_API_URL: http://localhost:18000
        run: pytest e2e/ -v

      - name: Tear down ephemeral stack
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.ci.yml -p enervision-ci --profile etl \
            down -v --remove-orphans

  deploy:
    name: Deploy on server
    needs: [test-e2e]
    # workflow_dispatch autorisé, mais seulement depuis dev : voir le commentaire
    # équivalent sur test-e2e sur les limites de cette garde en tant que if.
    # needs: [test-e2e] s'applique aussi au lancement manuel — pas de raccourci
    # pour bypasser l'e2e même en dispatch.
    if: github.ref == 'refs/heads/dev' && github.event_name != 'schedule'
    runs-on: self-hosted
    # Plus aucun build ici : le job ne fait qu'un pull + un up. Les 25 min
    # d'avant couvraient un `up -d --build` à froid sur 3 images, ce qui n'a
    # plus lieu d'être.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Ne pas supprimer les fichiers non versionnés (.env) présents sur le runner.
          clean: false

      - name: Restore production env file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          RCLONE_CRYPT_PASSWORD_RAW: ${{ secrets.RCLONE_CRYPT_PASSWORD_RAW }}
        run: |
          set -e
          # Valeurs non sensibles (versionnées) + mots de passe/clés (secrets
          # GitHub Actions) concaténés en un seul .env racine.
          #
          # Dupliqué à l'identique dans le job test-e2e (volontairement) : voir
          # le commentaire équivalent là-bas.
          cp infra/env/production.env .env
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
            echo "INGEST_API_KEY=$INGEST_API_KEY"
            echo "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD"
            echo "AZURE_STORAGE_KEY=$AZURE_STORAGE_KEY"
            echo "RCLONE_CRYPT_PASSWORD_RAW=$RCLONE_CRYPT_PASSWORD_RAW"
          } >> .env

      - name: Compute image references
        run: |
          set -e
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ns="${REGISTRY}/${owner}"
          echo "API_IMAGE=${ns}/enervision-api:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FRONT_IMAGE=${ns}/enervision-front:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "ETL_IMAGE=${ns}/enervision-etl:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "ML_IMAGE=${ns}/enervision-ml:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le pull est séparé du up volontairement : s'il échoue (registry
      # injoignable, image absente), la stack en cours n'est pas touchée et la
      # prod continue de tourner sur la version précédente. Un `up` qui échoue à
      # mi-chemin, lui, laisserait la stack à moitié recréée.
      - name: Deploy with docker compose
        run: |
          set -e

          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi

          $DOCKER_COMPOSE --profile etl --profile audit --profile proxy --profile mlflow pull

          $DOCKER_COMPOSE --profile etl --profile audit --profile proxy --profile mlflow \
            up -d --no-build --remove-orphans
