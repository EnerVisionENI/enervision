name: CI/CD dev

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - ev-021---auto-deploy-dev # TODO: retirer avant de merger dans dev, sert juste à tester le déploiement
  workflow_dispatch:

concurrency:
  group: enervision-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-api:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run API tests
        run: pytest api/tests -q

  build-front:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Build frontend
        working-directory: front
        run: npm run build

  deploy:
    name: Deploy on server
    needs:
      - test-api
      - build-front
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ev-021---auto-deploy-dev')
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Ne pas supprimer les fichiers non versionnés (.env) présents sur le runner.
          clean: false

      - name: Deploy with docker compose
        run: |
          set -e

          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi

          $DOCKER_COMPOSE -f infra/docker-compose.yml up -d --build --remove-orphans