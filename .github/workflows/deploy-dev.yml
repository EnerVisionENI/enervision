name: CI/CD dev

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: enervision-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-api:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt

      - name: Run API tests
        run: pytest api/tests -q

  build-front:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Build frontend
        working-directory: front
        run: npm run build

  deploy:
    name: Deploy on server
    needs:
      - test-api
      - build-front
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Ne pas supprimer les fichiers non versionnés (.env) présents sur le runner.
          clean: false

      - name: Restore production env file
        run: |
          set -e
          # Concatène les fichiers de secrets existants en un seul .env racine.
          # Les clés en double (POSTGRES_* dans postgres.env et api.env) portent
          # les mêmes valeurs ; la dernière occurrence l'emporte.
          cat /opt/enervision-secrets/postgres.env \
              /opt/enervision-secrets/api.env \
              /opt/enervision-secrets/minio.env \
              /opt/enervision-secrets/audit-sync.env \
              /opt/enervision-secrets/etl.env > .env

      - name: Deploy with docker compose
        run: |
          set -e

          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi

          $DOCKER_COMPOSE --profile etl --profile audit --profile proxy \
            up -d --build --remove-orphans