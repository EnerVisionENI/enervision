name: Restore production env file
description: >
  Reconstitue le .env racine à partir de infra/env/production.env (valeurs
  non sensibles, versionnées) et des secrets GitHub Actions (mots de passe /
  clés). Utilisé par test-e2e et deploy, seuls jobs qui lancent réellement
  docker compose.

inputs:
  postgres_password:
    required: true
  jwt_secret_key:
    required: true
  ingest_api_key:
    required: true
  minio_root_password:
    required: true
  azure_storage_key:
    required: true
  rclone_crypt_password_raw:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        JWT_SECRET_KEY: ${{ inputs.jwt_secret_key }}
        INGEST_API_KEY: ${{ inputs.ingest_api_key }}
        MINIO_ROOT_PASSWORD: ${{ inputs.minio_root_password }}
        AZURE_STORAGE_KEY: ${{ inputs.azure_storage_key }}
        RCLONE_CRYPT_PASSWORD_RAW: ${{ inputs.rclone_crypt_password_raw }}
      run: |
        set -e
        cp infra/env/production.env .env
        {
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
          echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
          echo "INGEST_API_KEY=$INGEST_API_KEY"
          echo "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD"
          echo "AZURE_STORAGE_KEY=$AZURE_STORAGE_KEY"
          echo "RCLONE_CRYPT_PASSWORD_RAW=$RCLONE_CRYPT_PASSWORD_RAW"
        } >> .env
