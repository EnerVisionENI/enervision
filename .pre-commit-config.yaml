repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(api|etl)/
      - id: ruff-format
        files: ^(api|etl)/

  # Réutilise l'ESLint + les devDependencies déjà installées dans front/ (via
  # `npm install`) plutôt que de faire gérer un environnement Node séparé par
  # pre-commit — nécessite juste que front/node_modules existe déjà localement.
  - repo: local
    hooks:
      - id: eslint-front
        name: eslint (front)
        entry: bash -c 'cd front && npm run lint'
        language: system
        files: ^front/.*\.(js|vue)$
        pass_filenames: false
