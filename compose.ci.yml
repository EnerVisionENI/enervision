# compose.ci.yml — override utilisé UNIQUEMENT par le job test-e2e du pipeline CI
# (.github/workflows/ci-cd.yml). Fait tourner une copie complète et jetable de la
# stack, isolée de la vraie prod qui tourne sur le même serveur self-hosted :
# noms de conteneurs différents, ports différents, volumes différents. Jamais
# utilisé en dehors de la CI, jamais en local.
#
# Démarrage :
#   docker compose -f compose.yaml -f compose.ci.yml -p enervision-ci --profile etl \
#     up -d --build postgres minio minio-init api etl-collect etl-alerts
#
# Destruction (y compris en cas d'échec des tests) :
#   docker compose -f compose.yaml -f compose.ci.yml -p enervision-ci --profile etl \
#     down -v --remove-orphans
#
# front / audit-sync ne sont pas nécessaires aux tests e2e (API + ETL uniquement) :
# ne pas les lister dans la commande up évite de les construire pour rien et
# raccourcit le job.

services:
  postgres:
    container_name: enervision-ci-postgres
    ports: !override
      - "15433:5432"

  minio:
    container_name: enervision-ci-minio
    ports: !override
      - "19000:9000"
      - "19001:9001"

  minio-init:
    container_name: enervision-ci-minio-init

  api:
    container_name: enervision-ci-api
    ports: !override
      - "18000:8000"

  etl-collect:
    container_name: enervision-ci-etl-collect
    environment:
      # Cycle rapide (5s au lieu de 60s) : les tests e2e n'attendent pas une
      # minute avant de voir une mesure/alerte apparaître. N'affecte que cette
      # stack jetable, jamais la vraie prod.
      INTERVALLE_SECONDES: "5"

  etl-alerts:
    container_name: enervision-ci-etl-alerts
    environment:
      ALERTS_INTERVALLE_SECONDES: "5"

volumes:
  pgdata:
    name: enervision_ci_pgdata
  miniodata:
    name: enervision_ci_miniodata
