version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev006-postgres
    restart: unless-stopped
    env_file:
      - ./postgres/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enervision-network

  minio:
    image: minio/minio:latest
    container_name: enervision-minio
    restart: unless-stopped
    env_file:
      - ./minio/.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - enervision-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: enervision-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./minio/.env
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    networks:
      - enervision-network
    restart: "no"

  audit-sync:
    image: rclone/rclone:latest
    container_name: enervision-audit-sync
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./audit-sync/.env
    entrypoint: ["/bin/sh", "/sync-audit-to-azure.sh"]
    volumes:
      - ./audit-sync/sync-audit-to-azure.sh:/sync-audit-to-azure.sh:ro
    networks:
      - enervision-network

  front:
    build:
      context: ..
      dockerfile: front/Dockerfile
    container_name: enervision-front
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - enervision-network
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: enervision-api
    ports:
      - "8000:8000"
    env_file:
      - ./postgres/.env
      - ../api/.env
    environment:
      - ENVIRONMENT=production
      # Réseau interne Compose : écrase les valeurs host (localhost:5433) de api/.env.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enervision-network
    restart: unless-stopped

  # Traefik reverse proxy (optionnel)
  traefik:
    image: traefik:v2.10
    container_name: enervision-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - enervision-network
    restart: unless-stopped

networks:
  enervision-network:
    driver: bridge

volumes:
  pgdata:
  miniodata: