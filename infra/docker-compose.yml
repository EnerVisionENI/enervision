version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev006-postgres
    restart: unless-stopped
    env_file:
      - ./postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: enervision-front
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - enervision-network
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: enervision-api
    ports:
      - "8000:8000"
    networks:
      - enervision-network
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped

  # Traefik reverse proxy (optionnel)
  traefik:
    image: traefik:v2.10
    container_name: enervision-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/traefik/traefik.yml:/traefik.yml:ro
      - ./infra/traefik/acme.json:/acme.json
    networks:
      - enervision-network
    restart: unless-stopped

networks:
  enervision-network:
    driver: bridge

volumes:
  pgdata:
