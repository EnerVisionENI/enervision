# Datasource Prometheus provisionnée au démarrage de Grafana.
# Aucune action manuelle : Grafana lit ce fichier via le volume
# ./infra/grafana/provisioning monté en lecture seule (voir compose.yaml).

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
